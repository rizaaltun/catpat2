name: Catpat2 Production QA Gate

on:
  push:
    branches:
      - chatgpt/development
    paths:
      - 'app.js'
      - 'index.html'
      - 'patches/**'
      - 'assets/**'
      - 'qa/**'
      - 'docs/studio/**'
      - 'docs/PRODUCTION_ROADMAP_30_DAYS_V07.md'
      - 'manifest.json'
      - '.github/workflows/qa-gate.yml'
  workflow_dispatch:

jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate Catpat2 v0.6 policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('qa/qa-agent-policy.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['productionTarget']['repository'] == 'rizaaltun/catpat2'
          assert data['productionTarget']['branch'] == 'chatgpt/development'
          assert data['productionTarget']['baseline'] == 'Catpat2 v0.6'
          assert data['productionTarget']['forbiddenProductionRepository'] == 'rizaaltun/catpat-game'
          assert data['runPolicy']['hourlyQa'] is False
          assert data['canonical']['catpatCanvas'] == [512, 640]
          assert data['canonical']['catpatPivot'] == [256, 620]
          assert data['canonical']['requireRgbaPngForCharacterFrames'] is True
          assert data['canonical']['rejectDuplicateFrames'] is True
          assert data['ui']['imageFirst'] is True
          assert data['ui']['finishedCodedPanelsForbidden'] is True
          assert data['gameplay']['mandatoryHazardsRequireMeasuredMovementEnvelope'] is True
          assert data['gameplay']['mandatoryHazardsRequirePracticalTouchQa'] is True
          print('Catpat2 v0.6 QA policy: PASS')
          PY

      - name: Audit canonical character assets when present
        run: |
          if [ -d assets/characters ]; then
            python qa/qa_agent.py assets/characters
          else
            echo 'Canonical character tree not yet fully promoted; baseline migration remains open.'
          fi

      - name: Audit v0.6 runtime migration
        continue-on-error: true
        run: python qa/v06_runtime_gate.py

      - name: Measure v0.6 route envelope
        continue-on-error: true
        run: python qa/v06_route_gate.py

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catpat2-qa-${{ github.sha }}
          path: |
            qa/last-report.json
            qa/v06-runtime-last-report.json
            qa/v06-route-last-report.json
            qa/V06_BASELINE_AUDIT.json
          if-no-files-found: warn
